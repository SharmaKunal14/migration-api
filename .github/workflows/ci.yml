name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: /api
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    container:
      image: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify application
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Generate application SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > application.cdx.json

      - name: Upload verified build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-build-${{ github.sha }}
          path: |
            application.cdx.json
            dist/
          if-no-files-found: error
          retention-days: 7

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate GitHub Actions workflows
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "${RUNNER_TEMP}/actionlint.tar.gz"
          echo \
            "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/actionlint.tar.gz" |
            sha256sum --check
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform

      - name: Prepare validation-only build placeholders
        run: |
          mkdir -p dist/services dist/web
          touch dist/services/api.js
          touch dist/services/outbox-dispatcher.js
          touch dist/services/workflow-control.js
          touch dist/services/github-webhook.js
          touch dist/services/github-token-broker.js
          printf '<!doctype html><title>validation only</title>' > dist/web/index.html

      - name: Initialize application providers
        working-directory: infra/terraform/environments/development
        run: terraform init -backend=false -input=false

      - name: Validate application configuration
        working-directory: infra/terraform/environments/development
        run: terraform validate

      - name: Initialize bootstrap providers
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate bootstrap configuration
        working-directory: infra/terraform/bootstrap
        run: terraform validate

  publish:
    name: Publish attested deployment artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [application, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_CI_ARTIFACT_ROLE_ARN: ${{ vars.AWS_CI_ARTIFACT_ROLE_ARN }}
      AWS_STS_REGIONAL_ENDPOINTS: regional
      ECR_REGISTRY:
        ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      VITE_API_BASE_URL: /api
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate artifact-publication inputs
        run: |
          test -n "${AWS_ACCOUNT_ID}"
          test -n "${AWS_REGION}"
          test -n "${AWS_CI_ARTIFACT_ROLE_ARN}"
          test -n "${VITE_SUPABASE_URL}"
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}"
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_CI_ARTIFACT_ROLE_ARN}" == \
            "arn:aws:iam::${AWS_ACCOUNT_ID}:role/migration-api-development-github-ci-artifacts" ]]

      - name: Download verified build outputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ci-build-${{ github.sha }}
          path: .

      - name: Configure short-lived image-publisher credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CI_ARTIFACT_ROLE_ARN }}
          role-session-name: migration-api-ci-artifacts-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Authenticate Docker to ECR
        run: |
          aws ecr get-login-password |
            docker login \
              --username AWS \
              --password-stdin \
              "${ECR_REGISTRY}"

      - name: Build and push exact-revision images
        id: images
        run: |
          mkdir -p promotion-evidence
          bash scripts/deploy/build-promotion-images.sh promotion-evidence

      - name: Gate on ECR vulnerability scans
        run: |
          bash scripts/deploy/wait-for-ecr-scans.sh \
            migration-api-development-agent \
            "${{ steps.images.outputs.agent_scan_digest }}" \
            promotion-evidence/agent-image-scan.json \
            migration-api-development-database-migrator \
            "${{ steps.images.outputs.migrator_scan_digest }}" \
            promotion-evidence/migrator-image-scan.json \
            migration-api-development-source-fetcher \
            "${{ steps.images.outputs.source_fetcher_scan_digest }}" \
            promotion-evidence/source-fetcher-image-scan.json \
            migration-api-development-vendor-fetcher \
            "${{ steps.images.outputs.vendor_fetcher_scan_digest }}" \
            promotion-evidence/vendor-fetcher-image-scan.json \
            migration-api-development-change-intelligence-agent \
            "${{ steps.images.outputs.change_intelligence_agent_scan_digest }}" \
            promotion-evidence/change-intelligence-agent-image-scan.json \
            migration-api-development-impact-analysis-agent \
            "${{ steps.images.outputs.impact_analysis_agent_scan_digest }}" \
            promotion-evidence/impact-analysis-agent-image-scan.json \
            migration-api-development-migration-agent \
            "${{ steps.images.outputs.migration_agent_scan_digest }}" \
            promotion-evidence/migration-agent-image-scan.json

      - name: Package exact deployment inputs
        env:
          MIGRATOR_CONTENT_DIGEST: ${{ steps.images.outputs.migrator_content_digest }}
        run: |
          tar -czf promotion-payload.tar.gz \
            application.cdx.json \
            dist \
            promotion-evidence
          node scripts/deploy/create-promotion-manifest.mjs \
            promotion-evidence/promotion-images.json \
            promotion-payload.tar.gz \
            promotion-manifest.json
          sha256sum promotion-payload.tar.gz promotion-manifest.json \
            > promotion-checksums.txt

      - name: Attest promotion payload and manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            promotion-payload.tar.gz
            promotion-manifest.json

      - name: Attest agent image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/migration-api-development-agent
          subject-digest: ${{ steps.images.outputs.agent_image_digest }}

      - name: Attest database-migrator image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name:
            ${{ env.ECR_REGISTRY }}/migration-api-development-database-migrator
          subject-digest: ${{ steps.images.outputs.migrator_image_digest }}

      - name: Attest source-fetcher image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/migration-api-development-source-fetcher
          subject-digest: ${{ steps.images.outputs.source_fetcher_image_digest }}

      - name: Attest vendor-fetcher image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/migration-api-development-vendor-fetcher
          subject-digest: ${{ steps.images.outputs.vendor_fetcher_image_digest }}

      - name: Attest change-intelligence image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name:
            ${{ env.ECR_REGISTRY }}/migration-api-development-change-intelligence-agent
          subject-digest:
            ${{ steps.images.outputs.change_intelligence_agent_image_digest }}

      - name: Attest impact-analysis image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name:
            ${{ env.ECR_REGISTRY }}/migration-api-development-impact-analysis-agent
          subject-digest: ${{ steps.images.outputs.impact_analysis_agent_image_digest }}

      - name: Attest migration-agent image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name:
            ${{ env.ECR_REGISTRY }}/migration-api-development-migration-agent
          subject-digest: ${{ steps.images.outputs.migration_agent_image_digest }}

      - name: Upload signed promotion package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-promotion-${{ github.sha }}
          path: |
            promotion-checksums.txt
            promotion-manifest.json
            promotion-payload.tar.gz
          if-no-files-found: error
          retention-days: 14
