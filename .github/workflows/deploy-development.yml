name: Deploy development

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-development to confirm the deployment
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_STS_REGIONAL_ENDPOINTS: regional

jobs:
  prepare:
    name: Build, migrate, and plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: development
    outputs:
      agent_image_digest: ${{ steps.images.outputs.agent_image_digest }}
      migrator_image_digest: ${{ steps.images.outputs.migrator_image_digest }}
      source_fetcher_image_digest:
        ${{ steps.images.outputs.source_fetcher_image_digest }}
      vendor_fetcher_image_digest:
        ${{ steps.images.outputs.vendor_fetcher_image_digest }}
      change_intelligence_agent_image_digest:
        ${{ steps.images.outputs.change_intelligence_agent_image_digest }}
      impact_analysis_agent_image_digest:
        ${{ steps.images.outputs.impact_analysis_agent_image_digest }}
      migration_agent_image_digest:
        ${{ steps.images.outputs.migration_agent_image_digest }}
      verifier_image_digest: ${{ steps.images.outputs.verifier_image_digest }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY:
        ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_product_domain: ${{ vars.PRODUCT_DOMAIN }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_supabase_url: ${{ vars.SUPABASE_URL }}
      TF_VAR_supabase_jwt_issuer: ${{ vars.SUPABASE_JWT_ISSUER }}
      TF_VAR_supabase_jwt_audience: ${{ vars.SUPABASE_JWT_AUDIENCE }}
      TF_VAR_supabase_jwks_url: ${{ vars.SUPABASE_JWKS_URL }}
      TF_VAR_database_secret_arn: ${{ vars.DATABASE_SECRET_ARN }}
      TF_VAR_database_secret_kms_key_arn: ${{ vars.DATABASE_SECRET_KMS_KEY_ARN }}
      TF_VAR_database_migration_secret_arn: ${{ vars.DATABASE_MIGRATION_SECRET_ARN }}
      TF_VAR_database_migration_secret_kms_key_arn:
        ${{ vars.DATABASE_MIGRATION_SECRET_KMS_KEY_ARN }}
      TF_VAR_development_nat_egress_cidr: ${{ vars.DEVELOPMENT_NAT_EGRESS_CIDR }}
      TF_VAR_development_nat_network_interface_id:
        ${{ vars.DEVELOPMENT_NAT_NETWORK_INTERFACE_ID }}
      TF_VAR_development_nat_route_table_id: ${{ vars.DEVELOPMENT_NAT_ROUTE_TABLE_ID }}
      TF_VAR_github_webhook_secret_arn: ${{ vars.MIGRATION_GITHUB_WEBHOOK_SECRET_ARN }}
      TF_VAR_github_webhook_secret_kms_key_arn:
        ${{ vars.MIGRATION_GITHUB_WEBHOOK_SECRET_KMS_KEY_ARN }}
      TF_VAR_github_app_secret_arn: ${{ vars.MIGRATION_GITHUB_APP_SECRET_ARN }}
      TF_VAR_github_app_secret_kms_key_arn:
        ${{ vars.MIGRATION_GITHUB_APP_SECRET_KMS_KEY_ARN }}
      TF_VAR_github_app_slug: ${{ vars.MIGRATION_GITHUB_APP_SLUG }}
      TF_VAR_openai_identity_provider_id: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      TF_VAR_openai_service_account_id: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      TF_VAR_openai_model: ${{ vars.OPENAI_MODEL }}
      TF_VAR_openai_project_alias: ${{ vars.OPENAI_PROJECT_ALIAS }}
      TF_VAR_change_intelligence_openai_identity_provider_id:
        ${{ vars.CHANGE_INTELLIGENCE_OPENAI_IDENTITY_PROVIDER_ID }}
      TF_VAR_change_intelligence_openai_service_account_id:
        ${{ vars.CHANGE_INTELLIGENCE_OPENAI_SERVICE_ACCOUNT_ID }}
      TF_VAR_impact_analysis_openai_identity_provider_id:
        ${{ vars.IMPACT_ANALYSIS_OPENAI_IDENTITY_PROVIDER_ID }}
      TF_VAR_impact_analysis_openai_service_account_id:
        ${{ vars.IMPACT_ANALYSIS_OPENAI_SERVICE_ACCOUNT_ID }}
      TF_VAR_migration_agent_openai_identity_provider_id:
        ${{ vars.MIGRATION_AGENT_OPENAI_IDENTITY_PROVIDER_ID }}
      TF_VAR_migration_agent_openai_service_account_id:
        ${{ vars.MIGRATION_AGENT_OPENAI_SERVICE_ACCOUNT_ID }}

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate protected deployment inputs
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/deploy/validate-environment.mjs

      - name: Create evidence directory
        run: |
          mkdir -p deployment-evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "actor=${GITHUB_ACTOR}"
          } > deployment-evidence/deployment.txt

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify application and infrastructure inputs
        env:
          VITE_API_BASE_URL: /api
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Generate application SBOM
        run:
          npm sbom --omit=dev --sbom-format=cyclonedx >
          deployment-evidence/application.cdx.json

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: migration-api-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify AWS identity and deployment foundation
        run: |
          aws sts get-caller-identity --query Arn --output text
          aws ecr describe-repositories \
            --repository-names \
              migration-api-development-agent \
              migration-api-development-database-migrator \
              migration-api-development-source-fetcher \
              migration-api-development-vendor-fetcher \
              migration-api-development-change-intelligence-agent \
              migration-api-development-impact-analysis-agent \
              migration-api-development-migration-agent \
              migration-api-development-verifier \
            --output json > deployment-evidence/ecr-repositories.json

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize and validate Terraform
        working-directory: infra/terraform/environments/development
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="kms_key_id=${TF_STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true"
          terraform validate

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Authenticate Docker to ECR
        run: |
          aws ecr get-login-password |
            docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build and push immutable images
        run: |
          agent_image="${ECR_REGISTRY}/migration-api-development-agent:${GITHUB_SHA}"
          migrator_image="${ECR_REGISTRY}/migration-api-development-database-migrator:${GITHUB_SHA}"
          source_fetcher_image="${ECR_REGISTRY}/migration-api-development-source-fetcher:${GITHUB_SHA}"
          vendor_fetcher_image="${ECR_REGISTRY}/migration-api-development-vendor-fetcher:${GITHUB_SHA}"
          change_intelligence_agent_image="${ECR_REGISTRY}/migration-api-development-change-intelligence-agent:${GITHUB_SHA}"
          impact_analysis_agent_image="${ECR_REGISTRY}/migration-api-development-impact-analysis-agent:${GITHUB_SHA}"
          migration_agent_image="${ECR_REGISTRY}/migration-api-development-migration-agent:${GITHUB_SHA}"
          verifier_image="${ECR_REGISTRY}/migration-api-development-verifier:${GITHUB_SHA}"
          if ! aws ecr describe-images \
            --repository-name migration-api-development-agent \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker buildx build \
              --file workers/agent/Dockerfile \
              --platform linux/arm64 \
              --provenance=mode=max \
              --sbom=true \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "${agent_image}" \
              --push \
              .
          fi
          if ! aws ecr describe-images \
            --repository-name migration-api-development-source-fetcher \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker buildx build \
              --file workers/source-fetcher/Dockerfile \
              --platform linux/arm64 \
              --provenance=mode=max \
              --sbom=true \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "${source_fetcher_image}" \
              --push \
              .
          fi
          if ! aws ecr describe-images \
            --repository-name migration-api-development-vendor-fetcher \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker buildx build \
              --file workers/vendor-fetcher/Dockerfile \
              --platform linux/arm64 \
              --provenance=mode=max \
              --sbom=true \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "${vendor_fetcher_image}" \
              --push \
              .
          fi
          if ! aws ecr describe-images \
            --repository-name migration-api-development-change-intelligence-agent \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker buildx build \
              --file workers/change-intelligence-agent/Dockerfile \
              --platform linux/arm64 \
              --provenance=mode=max \
              --sbom=true \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "${change_intelligence_agent_image}" \
              --push \
              .
          fi
          if ! aws ecr describe-images \
            --repository-name migration-api-development-impact-analysis-agent \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker buildx build \
              --file workers/impact-analysis-agent/Dockerfile \
              --platform linux/arm64 \
              --provenance=mode=max \
              --sbom=true \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "${impact_analysis_agent_image}" \
              --push \
              .
          fi
          if ! aws ecr describe-images \
            --repository-name migration-api-development-migration-agent \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker buildx build \
              --file workers/migration-agent/Dockerfile \
              --platform linux/arm64 \
              --provenance=mode=max \
              --sbom=true \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "${migration_agent_image}" \
              --push \
              .
          fi
          if ! aws ecr describe-images \
            --repository-name migration-api-development-verifier \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker buildx build \
              --file workers/verifier/Dockerfile \
              --platform linux/arm64 \
              --provenance=mode=max \
              --sbom=true \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "${verifier_image}" \
              --push \
              .
          fi
          if ! aws ecr describe-images \
            --repository-name migration-api-development-database-migrator \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker buildx build \
              --file workers/database-migrator/Dockerfile \
              --platform linux/arm64 \
              --provenance=mode=max \
              --sbom=true \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "${migrator_image}" \
              --push \
              .
          fi

      - name: Resolve and validate immutable image digests
        id: images
        run: |
          agent_digest="$(aws ecr describe-images \
            --repository-name migration-api-development-agent \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          migrator_digest="$(aws ecr describe-images \
            --repository-name migration-api-development-database-migrator \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          source_fetcher_digest="$(aws ecr describe-images \
            --repository-name migration-api-development-source-fetcher \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          vendor_fetcher_digest="$(aws ecr describe-images \
            --repository-name migration-api-development-vendor-fetcher \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          change_intelligence_agent_digest="$(aws ecr describe-images \
            --repository-name migration-api-development-change-intelligence-agent \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          impact_analysis_agent_digest="$(aws ecr describe-images \
            --repository-name migration-api-development-impact-analysis-agent \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          migration_agent_digest="$(aws ecr describe-images \
            --repository-name migration-api-development-migration-agent \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          verifier_digest="$(aws ecr describe-images \
            --repository-name migration-api-development-verifier \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "${agent_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Agent digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${migrator_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Migrator digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${source_fetcher_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Source-fetcher digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${vendor_fetcher_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Vendor-fetcher digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${change_intelligence_agent_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Change-intelligence agent digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${impact_analysis_agent_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Impact-analysis agent digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${migration_agent_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Migration-agent digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${verifier_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Verifier digest is invalid." >&2
            exit 1
          fi
          resolve_arm64_digest() {
            local image_reference="${1:?image reference is required}"
            docker buildx imagetools inspect --raw "${image_reference}" |
              jq -er '
                [
                  .manifests[]
                  | select(
                      .platform.os == "linux"
                      and .platform.architecture == "arm64"
                    )
                  | .digest
                ]
                | if length == 1 then .[0]
                  else error("expected exactly one linux/arm64 image manifest")
                  end
              '
          }
          agent_scan_digest="$(resolve_arm64_digest \
            "${ECR_REGISTRY}/migration-api-development-agent@${agent_digest}")"
          migrator_scan_digest="$(resolve_arm64_digest \
            "${ECR_REGISTRY}/migration-api-development-database-migrator@${migrator_digest}")"
          source_fetcher_scan_digest="$(resolve_arm64_digest \
            "${ECR_REGISTRY}/migration-api-development-source-fetcher@${source_fetcher_digest}")"
          vendor_fetcher_scan_digest="$(resolve_arm64_digest \
            "${ECR_REGISTRY}/migration-api-development-vendor-fetcher@${vendor_fetcher_digest}")"
          change_intelligence_agent_scan_digest="$(resolve_arm64_digest \
            "${ECR_REGISTRY}/migration-api-development-change-intelligence-agent@${change_intelligence_agent_digest}")"
          impact_analysis_agent_scan_digest="$(resolve_arm64_digest \
            "${ECR_REGISTRY}/migration-api-development-impact-analysis-agent@${impact_analysis_agent_digest}")"
          migration_agent_scan_digest="$(resolve_arm64_digest \
            "${ECR_REGISTRY}/migration-api-development-migration-agent@${migration_agent_digest}")"
          verifier_scan_digest="$(resolve_arm64_digest \
            "${ECR_REGISTRY}/migration-api-development-verifier@${verifier_digest}")"
          if [[ ! "${agent_scan_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Agent scan digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${migrator_scan_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Migrator scan digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${source_fetcher_scan_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Source-fetcher scan digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${vendor_fetcher_scan_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Vendor-fetcher scan digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${change_intelligence_agent_scan_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Change-intelligence agent scan digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${impact_analysis_agent_scan_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Impact-analysis agent scan digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${migration_agent_scan_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Migration-agent scan digest is invalid." >&2
            exit 1
          fi
          if [[ ! "${verifier_scan_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Verifier scan digest is invalid." >&2
            exit 1
          fi
          {
            echo "TF_VAR_agent_image_digest=${agent_digest}"
            echo "TF_VAR_migrator_image_digest=${migrator_digest}"
            echo "TF_VAR_source_fetcher_image_digest=${source_fetcher_digest}"
            echo "TF_VAR_vendor_fetcher_image_digest=${vendor_fetcher_digest}"
            echo "TF_VAR_change_intelligence_agent_image_digest=${change_intelligence_agent_digest}"
            echo "TF_VAR_impact_analysis_agent_image_digest=${impact_analysis_agent_digest}"
            echo "TF_VAR_migration_agent_image_digest=${migration_agent_digest}"
            echo "TF_VAR_verifier_image_digest=${verifier_digest}"
            echo "AGENT_SCAN_DIGEST=${agent_scan_digest}"
            echo "MIGRATOR_SCAN_DIGEST=${migrator_scan_digest}"
            echo "SOURCE_FETCHER_SCAN_DIGEST=${source_fetcher_scan_digest}"
            echo "VENDOR_FETCHER_SCAN_DIGEST=${vendor_fetcher_scan_digest}"
            echo "CHANGE_INTELLIGENCE_AGENT_SCAN_DIGEST=${change_intelligence_agent_scan_digest}"
            echo "IMPACT_ANALYSIS_AGENT_SCAN_DIGEST=${impact_analysis_agent_scan_digest}"
            echo "MIGRATION_AGENT_SCAN_DIGEST=${migration_agent_scan_digest}"
            echo "VERIFIER_SCAN_DIGEST=${verifier_scan_digest}"
          } >> "${GITHUB_ENV}"
          {
            echo "agent_image_digest=${agent_digest}"
            echo "migrator_image_digest=${migrator_digest}"
            echo "source_fetcher_image_digest=${source_fetcher_digest}"
            echo "vendor_fetcher_image_digest=${vendor_fetcher_digest}"
            echo "change_intelligence_agent_image_digest=${change_intelligence_agent_digest}"
            echo "impact_analysis_agent_image_digest=${impact_analysis_agent_digest}"
            echo "migration_agent_image_digest=${migration_agent_digest}"
            echo "verifier_image_digest=${verifier_digest}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "agent_image_digest=${agent_digest}"
            echo "migrator_image_digest=${migrator_digest}"
            echo "source_fetcher_image_digest=${source_fetcher_digest}"
            echo "vendor_fetcher_image_digest=${vendor_fetcher_digest}"
            echo "change_intelligence_agent_image_digest=${change_intelligence_agent_digest}"
            echo "impact_analysis_agent_image_digest=${impact_analysis_agent_digest}"
            echo "migration_agent_image_digest=${migration_agent_digest}"
            echo "verifier_image_digest=${verifier_digest}"
            echo "agent_scan_digest=${agent_scan_digest}"
            echo "migrator_scan_digest=${migrator_scan_digest}"
            echo "source_fetcher_scan_digest=${source_fetcher_scan_digest}"
            echo "vendor_fetcher_scan_digest=${vendor_fetcher_scan_digest}"
            echo "change_intelligence_agent_scan_digest=${change_intelligence_agent_scan_digest}"
            echo "impact_analysis_agent_scan_digest=${impact_analysis_agent_scan_digest}"
            echo "migration_agent_scan_digest=${migration_agent_scan_digest}"
            echo "verifier_scan_digest=${verifier_scan_digest}"
          } >> deployment-evidence/deployment.txt

      - name: Gate on ECR vulnerability scans
        run: |
          bash scripts/deploy/wait-for-ecr-scans.sh \
            migration-api-development-agent \
            "${AGENT_SCAN_DIGEST}" \
            deployment-evidence/agent-image-scan.json \
            migration-api-development-database-migrator \
            "${MIGRATOR_SCAN_DIGEST}" \
            deployment-evidence/migrator-image-scan.json \
            migration-api-development-source-fetcher \
            "${SOURCE_FETCHER_SCAN_DIGEST}" \
            deployment-evidence/source-fetcher-image-scan.json \
            migration-api-development-vendor-fetcher \
            "${VENDOR_FETCHER_SCAN_DIGEST}" \
            deployment-evidence/vendor-fetcher-image-scan.json \
            migration-api-development-change-intelligence-agent \
            "${CHANGE_INTELLIGENCE_AGENT_SCAN_DIGEST}" \
            deployment-evidence/change-intelligence-agent-image-scan.json \
            migration-api-development-impact-analysis-agent \
            "${IMPACT_ANALYSIS_AGENT_SCAN_DIGEST}" \
            deployment-evidence/impact-analysis-agent-image-scan.json \
            migration-api-development-migration-agent \
            "${MIGRATION_AGENT_SCAN_DIGEST}" \
            deployment-evidence/migration-agent-image-scan.json \
            migration-api-development-verifier \
            "${VERIFIER_SCAN_DIGEST}" \
            deployment-evidence/verifier-image-scan.json

      - name: Refresh AWS credentials for migration and planning
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: migration-api-plan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Update the migrator task definition and policies
        working-directory: infra/terraform/environments/development
        run: |
          terraform plan \
            -input=false \
            -out=migrator.tfplan \
            -target=aws_ecs_task_definition.migrator \
            -target=aws_iam_role_policy.migrator_execution \
            -target=aws_iam_role_policy.migrator_task
          terraform show -no-color migrator.tfplan > ../../../../deployment-evidence/migrator-plan.txt
          terraform apply -input=false migrator.tfplan

      - name: Run database migrations from Fargate
        run: |
          bash scripts/deploy/run-migrator.sh \
            infra/terraform/environments/development \
            deployment-evidence

      - name: Create and inspect the complete deployment plan
        working-directory: infra/terraform/environments/development
        run: |
          set -o pipefail
          terraform plan -input=false -out=stage-1.tfplan
          terraform show -no-color stage-1.tfplan > ../../../../deployment-evidence/terraform-plan.txt
          if grep -Eq 'replace-with|sha256:0{64}' ../../../../deployment-evidence/terraform-plan.txt; then
            echo "Terraform plan contains placeholder values." >&2
            exit 1
          fi
          terraform show -json stage-1.tfplan |
            node ../../../../scripts/deploy/validate-development-network-plan.mjs -

      - name: Package the exact saved-plan inputs
        run: |
          tar -czf deployment-plan-payload.tar.gz \
            infra/terraform/environments/development/stage-1.tfplan \
            infra/terraform/environments/development/.terraform/api.zip \
            infra/terraform/environments/development/.terraform/github-reconciler.zip \
            infra/terraform/environments/development/.terraform/github-token-broker.zip \
            infra/terraform/environments/development/.terraform/github-webhook.zip \
            infra/terraform/environments/development/.terraform/outbox.zip \
            infra/terraform/environments/development/.terraform/repository-scan-control.zip \
            infra/terraform/environments/development/.terraform/package-source-resolver.zip \
            infra/terraform/environments/development/.terraform/vendor-intelligence-control.zip \
            infra/terraform/environments/development/.terraform/impact-analysis-control.zip \
            infra/terraform/environments/development/.terraform/workflow-control.zip \
            dist/web
          sha256sum deployment-plan-payload.tar.gz \
            > deployment-plan-payload.tar.gz.sha256

      - name: Upload the saved-plan payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-plan-payload.tar.gz
            deployment-plan-payload.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 30

  apply:
    name: Approve and apply the saved plan
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: development
      url: ${{ steps.deployment.outputs.product_url }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_product_domain: ${{ vars.PRODUCT_DOMAIN }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_supabase_url: ${{ vars.SUPABASE_URL }}
      TF_VAR_supabase_jwt_issuer: ${{ vars.SUPABASE_JWT_ISSUER }}
      TF_VAR_supabase_jwt_audience: ${{ vars.SUPABASE_JWT_AUDIENCE }}
      TF_VAR_supabase_jwks_url: ${{ vars.SUPABASE_JWKS_URL }}
      TF_VAR_database_secret_arn: ${{ vars.DATABASE_SECRET_ARN }}
      TF_VAR_database_secret_kms_key_arn: ${{ vars.DATABASE_SECRET_KMS_KEY_ARN }}
      TF_VAR_database_migration_secret_arn: ${{ vars.DATABASE_MIGRATION_SECRET_ARN }}
      TF_VAR_database_migration_secret_kms_key_arn:
        ${{ vars.DATABASE_MIGRATION_SECRET_KMS_KEY_ARN }}
      TF_VAR_development_nat_egress_cidr: ${{ vars.DEVELOPMENT_NAT_EGRESS_CIDR }}
      TF_VAR_development_nat_network_interface_id:
        ${{ vars.DEVELOPMENT_NAT_NETWORK_INTERFACE_ID }}
      TF_VAR_development_nat_route_table_id: ${{ vars.DEVELOPMENT_NAT_ROUTE_TABLE_ID }}
      TF_VAR_github_webhook_secret_arn: ${{ vars.MIGRATION_GITHUB_WEBHOOK_SECRET_ARN }}
      TF_VAR_github_webhook_secret_kms_key_arn:
        ${{ vars.MIGRATION_GITHUB_WEBHOOK_SECRET_KMS_KEY_ARN }}
      TF_VAR_github_app_secret_arn: ${{ vars.MIGRATION_GITHUB_APP_SECRET_ARN }}
      TF_VAR_github_app_secret_kms_key_arn:
        ${{ vars.MIGRATION_GITHUB_APP_SECRET_KMS_KEY_ARN }}
      TF_VAR_github_app_slug: ${{ vars.MIGRATION_GITHUB_APP_SLUG }}
      TF_VAR_openai_identity_provider_id: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      TF_VAR_openai_service_account_id: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      TF_VAR_openai_model: ${{ vars.OPENAI_MODEL }}
      TF_VAR_openai_project_alias: ${{ vars.OPENAI_PROJECT_ALIAS }}
      TF_VAR_change_intelligence_openai_identity_provider_id:
        ${{ vars.CHANGE_INTELLIGENCE_OPENAI_IDENTITY_PROVIDER_ID }}
      TF_VAR_change_intelligence_openai_service_account_id:
        ${{ vars.CHANGE_INTELLIGENCE_OPENAI_SERVICE_ACCOUNT_ID }}
      TF_VAR_impact_analysis_openai_identity_provider_id:
        ${{ vars.IMPACT_ANALYSIS_OPENAI_IDENTITY_PROVIDER_ID }}
      TF_VAR_impact_analysis_openai_service_account_id:
        ${{ vars.IMPACT_ANALYSIS_OPENAI_SERVICE_ACCOUNT_ID }}
      TF_VAR_migration_agent_openai_identity_provider_id:
        ${{ vars.MIGRATION_AGENT_OPENAI_IDENTITY_PROVIDER_ID }}
      TF_VAR_migration_agent_openai_service_account_id:
        ${{ vars.MIGRATION_AGENT_OPENAI_SERVICE_ACCOUNT_ID }}
      TF_VAR_agent_image_digest: ${{ needs.prepare.outputs.agent_image_digest }}
      TF_VAR_migrator_image_digest: ${{ needs.prepare.outputs.migrator_image_digest }}
      TF_VAR_source_fetcher_image_digest:
        ${{ needs.prepare.outputs.source_fetcher_image_digest }}
      TF_VAR_vendor_fetcher_image_digest:
        ${{ needs.prepare.outputs.vendor_fetcher_image_digest }}
      TF_VAR_change_intelligence_agent_image_digest:
        ${{ needs.prepare.outputs.change_intelligence_agent_image_digest }}
      TF_VAR_impact_analysis_agent_image_digest:
        ${{ needs.prepare.outputs.impact_analysis_agent_image_digest }}
      TF_VAR_migration_agent_image_digest:
        ${{ needs.prepare.outputs.migration_agent_image_digest }}
      TF_VAR_verifier_image_digest: ${{ needs.prepare.outputs.verifier_image_digest }}

    steps:
      - name: Check out the exact planned revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Revalidate protected deployment inputs
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/deploy/validate-environment.mjs

      - name: Configure fresh short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: migration-api-apply-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra/terraform/environments/development
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="kms_key_id=${TF_STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true"

      - name: Download the reviewed saved-plan payload
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: development-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Restore the saved-plan inputs
        run: |
          sha256sum --check deployment-plan-payload.tar.gz.sha256
          tar -xzf deployment-plan-payload.tar.gz
          test -s infra/terraform/environments/development/stage-1.tfplan
          test -s infra/terraform/environments/development/.terraform/api.zip
          test -s infra/terraform/environments/development/.terraform/github-reconciler.zip
          test -s infra/terraform/environments/development/.terraform/github-token-broker.zip
          test -s infra/terraform/environments/development/.terraform/github-webhook.zip
          test -s infra/terraform/environments/development/.terraform/outbox.zip
          test -s infra/terraform/environments/development/.terraform/repository-scan-control.zip
          test -s infra/terraform/environments/development/.terraform/package-source-resolver.zip
          test -s infra/terraform/environments/development/.terraform/vendor-intelligence-control.zip
          test -s infra/terraform/environments/development/.terraform/impact-analysis-control.zip
          test -s infra/terraform/environments/development/.terraform/workflow-control.zip

      - name: Apply the exact reviewed plan
        working-directory: infra/terraform/environments/development
        run: |
          set -o pipefail
          mkdir -p ../../../../deployment-evidence
          terraform apply -input=false stage-1.tfplan |
            tee ../../../../deployment-evidence/terraform-apply.txt
          terraform output -json > ../../../../deployment-evidence/terraform-outputs.json

      - name: Smoke-test the public deployment
        id: deployment
        run: |
          product_url="$(terraform \
            -chdir=infra/terraform/environments/development \
            output -raw product_url)"
          cloudfront_cname_target="$(terraform \
            -chdir=infra/terraform/environments/development \
            output -raw cloudfront_cname_target)"
          echo "product_url=${product_url}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=GoDaddy DNS required::Create a CNAME for ${product_url#https://} pointing to ${cloudfront_cname_target}"
          bash scripts/deploy/smoke-test.sh \
            "${product_url}" \
            "${cloudfront_cname_target}" \
            deployment-evidence
          {
            echo "### Development deployment"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- URL: ${product_url}"
            echo "- GoDaddy CNAME target: \`${cloudfront_cname_target}\`"
            echo "- Agent: \`${TF_VAR_agent_image_digest}\`"
            echo "- Migrator: \`${TF_VAR_migrator_image_digest}\`"
            echo "- Source fetcher: \`${TF_VAR_source_fetcher_image_digest}\`"
            echo "- Vendor fetcher: \`${TF_VAR_vendor_fetcher_image_digest}\`"
            echo "- Change intelligence: \`${TF_VAR_change_intelligence_agent_image_digest}\`"
            echo "- Impact analysis: \`${TF_VAR_impact_analysis_agent_image_digest}\`"
            echo "- Migration agent: \`${TF_VAR_migration_agent_image_digest}\`"
            echo "- Verifier: \`${TF_VAR_verifier_image_digest}\`"
            echo "- Migration: passed"
            echo "- Saved-plan approval: passed"
            echo "- Public smoke checks: passed"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 30
